name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22: lowest version allowed by package.json "engines".
        # 24: minimum Node.js version of current n8n 2.x releases.
        # 26: current Active LTS, which n8n's own starter targets via `lts/*`.
        node: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  n8n-v3:
    # Type-checks and tests the node against the n8n 3.x workflow library so
    # API changes in n8n 3 show up here before users hit them.
    name: n8n 3 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm install --no-save 'n8n-workflow@^3'
      # `npm ls` would flag the swapped-in 3.x as outside the declared
      # ^2 range, so check the installed version directly instead.
      - name: Confirm n8n-workflow 3.x is installed
        run: >-
          node -e "const v = require('n8n-workflow/package.json').version;
          console.log('n8n-workflow', v);
          if (!v.startsWith('3.')) { console.error('expected n8n-workflow 3.x'); process.exit(1); }"
      - run: npm run typecheck
      - run: npm test
