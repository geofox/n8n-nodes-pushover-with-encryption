version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (used by @n8n/node-cli's lint config) supports
      # TypeScript < 6.1 and ts-jest supports < 7. Lift once both support it.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # @n8n/node-cli's lint config and n8n's lint plugin target ESLint 9.
      - dependency-name: eslint
        versions: ['>=10']
      # Node.js types follow the lowest Node.js version in "engines".
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
