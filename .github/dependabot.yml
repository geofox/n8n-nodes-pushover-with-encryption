version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Supply-chain hygiene: wait before proposing a freshly published
    # version, so that a compromised release has time to be caught and
    # pulled. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (used by @n8n/node-cli's lint config) supports
      # TypeScript < 6.1 and ts-jest supports < 7. Lift once both support it.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Node.js types follow the lowest Node.js version in "engines".
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
